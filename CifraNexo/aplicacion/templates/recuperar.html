{% extends "base.html" %}{% block titulo %}Recuperar contraseña{% endblock %}
{% block contenido %}
<h1>Recuperar contraseña</h1>
<p class="suave">Recibirás un enlace temporal de un solo uso. (Simulado: el correo se escribe en la carpeta <code>buzon/</code>.)</p>
<form method="post" class="apilado">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Correo <input type="email" name="email" required maxlength="254"></label>
  <button>Enviar enlace</button>
</form>
{% endblock %}
