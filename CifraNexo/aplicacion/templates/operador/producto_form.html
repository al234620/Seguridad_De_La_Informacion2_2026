{% extends "base.html" %}{% block titulo %}{{ 'Editar' if p else 'Nuevo' }} producto{% endblock %}
{% block contenido %}
<h1>{{ 'Editar' if p else 'Registrar' }} producto</h1>
<form method="post" enctype="multipart/form-data" class="apilado">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Nombre <input name="name" required maxlength="120" value="{{ p.name if p else '' }}"></label>
  <label>Descripción <textarea name="description" maxlength="2000" rows="4">{{ p.description if p else '' }}</textarea></label>
  <label>Precio (MXN) <input name="price" required pattern="\d{1,7}(\.\d{1,2})?" value="{{ '%.2f'|format(p.price/100) if p else '' }}"></label>
  <label>Archivo PDF {{ '(opcional, reemplaza el actual)' if p else '' }} <input type="file" name="archivo" accept="application/pdf" {{ '' if p else 'required' }}></label>
  <button>Guardar</button>
</form>
{% endblock %}
