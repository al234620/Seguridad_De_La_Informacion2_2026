{% extends "base.html" %}{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<h1>Iniciar sesión</h1>
<form method="post" class="apilado" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Correo <input type="email" name="email" required maxlength="254" autocomplete="username"></label>
  <label>Contraseña <input type="password" name="password" required maxlength="128" autocomplete="current-password"></label>
  <button>Entrar</button>
  <a href="{{ url_for('publico.recuperar') }}">¿Olvidaste tu contraseña?</a>
</form>
{% endblock %}
